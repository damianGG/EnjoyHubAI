name: Ticketing Concurrency Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticketing-concurrency-staging
  cancel-in-progress: false

jobs:
  concurrency:
    name: ticketing-concurrency-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate staging secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Missing STAGING_SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing STAGING_SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Run concurrency / overbooking test
        env:
          ALLOW_TICKETING_CONCURRENCY_TEST: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:ticketing-concurrency
